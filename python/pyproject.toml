[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cartographer-mlx"
version = "0.1.0"
description = "Cartographer MLX Intelligence Service — local inference with managed KV cache"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "starlette>=0.27",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.31",
    "mlx-lm>=0.31",
    "fastapi>=0.128",
    "uvicorn>=0.34",
]
dev = [
    "pytest>=7.0",
    "httpx",
    "pytest-asyncio",
    "fastapi>=0.128",
]
all = [
    "cartographer-mlx[mlx]",
    "cartographer-mlx[dev]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
cartographer-mlx = "cartographer_mlx.server:main"
